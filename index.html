<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Kiosk AI Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col justify-between p-6">
    <div class="flex justify-between items-center mb-8">
        <div class="text-sm font-bold tracking-widest text-red-500">10:24 AM</div>
        <div class="text-xs bg-green-500 px-2 py-1 rounded-full text-black font-semibold">Free WiFi Active</div>
    </div>

    <div class="flex flex-col items-center text-center space-y-4">
        <img src="https://ui-avatars.com/api/?name=AI&background=random&color=fff&rounded=true&size=128" alt="AI Avatar" class="w-24 h-24 rounded-full shadow-lg border-4 border-red-600">
        <h1 class="text-3xl font-bold">Hello</h1>
        <p class="text-gray-400">How can I help you today?</p>
    </div>

    <div class="flex flex-col space-y-3 mt-8 w-full max-w-sm mx-auto">
        <button class="bg-gray-800 hover:bg-gray-700 p-4 rounded-xl flex items-center shadow transition-colors">
            <span class="text-xl mr-4">📍</span>
            <span class="font-medium">Directions & Transport</span>
        </button>
        <button class="bg-gray-800 hover:bg-gray-700 p-4 rounded-xl flex items-center shadow transition-colors">
            <span class="text-xl mr-4">➕</span>
            <span class="font-medium">Medical Advice</span>
        </button>
        <button class="bg-gray-800 hover:bg-gray-700 p-4 rounded-xl flex items-center shadow transition-colors">
            <span class="text-xl mr-4">⚠️</span>
            <span class="font-medium text-red-400">Emergency Contact</span>
        </button>
    </div>

    <div class="mt-auto pt-8 flex flex-col items-center">
        <button class="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(220,38,38,0.7)] animate-pulse">
            <span class="text-2xl">🎤</span>
        </button>
        <p class="text-xs text-gray-500 mt-4 uppercase tracking-widest">Tap to speak</p>
    </div>
</body>
</html>
